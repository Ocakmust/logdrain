name: Build Linux binary

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux binary
        run: |
          mkdir -p dist
          cargo build --release -p logdrain-cli --bin logdrain
          cp target/release/logdrain dist/logdrain-linux-amd64
          chmod +x dist/logdrain-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/*