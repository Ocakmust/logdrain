name: Build logdrain binaries

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install Windows cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build Linux binary
        run: |
          set -eux
          cargo build --release -p logdrain-cli --bin logdrain
          ls -la target/release
          mkdir -p dist
          cp target/release/logdrain dist/logdrain-linux-amd64
          chmod +x dist/logdrain-linux-amd64

      - name: Build Windows .exe
        run: |
          set -eux
          cargo build --release --target x86_64-pc-windows-gnu -p logdrain-cli --bin logdrain
          ls -la target/x86_64-pc-windows-gnu/release
          cp target/x86_64-pc-windows-gnu/release/logdrain.exe dist/logdrain.exe

      - name: Show dist contents
        run: |
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logdrain-binaries
          path: dist/*
